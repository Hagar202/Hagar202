<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hagar Soliman, AI Engineer. An eye-tracking reticle calibrates across five points." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name{font:600 70px Fraunces,Georgia,'Times New Roman',serif;fill:#FAF8FC;letter-spacing:-1.5px}
    .role{font:400 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#D9C8E4}
    .stat{font:600 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#B8862B}
    .tiny{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#B8862B;letter-spacing:2px}
    .fade{opacity:0;animation:in .9s ease forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
    @keyframes in{to{opacity:1}}
    /* calibration: the gaze moves across 5 points, each lights up when reached (8s loop) */
    .gaze{animation:gaze 8s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes gaze{
      0%,8%{transform:translate(905px,70px)}
      18%,26%{transform:translate(1115px,70px)}
      36%,44%{transform:translate(1115px,250px)}
      54%,62%{transform:translate(905px,250px)}
      72%,92%{transform:translate(1010px,160px)}
      100%{transform:translate(905px,70px)}
    }
    .pt{fill:#3A2148;stroke:#6A2C8C;stroke-width:2}
    .p1{animation:p1 8s infinite}.p2{animation:p2 8s infinite}.p3{animation:p3 8s infinite}.p4{animation:p4 8s infinite}.p5{animation:p5 8s infinite}
    @keyframes p1{0%,4%{fill:#3A2148}6%,92%{fill:#B8862B}100%{fill:#3A2148}}
    @keyframes p2{0%,22%{fill:#3A2148}24%,92%{fill:#B8862B}100%{fill:#3A2148}}
    @keyframes p3{0%,40%{fill:#3A2148}42%,92%{fill:#B8862B}100%{fill:#3A2148}}
    @keyframes p4{0%,58%{fill:#3A2148}60%,92%{fill:#B8862B}100%{fill:#3A2148}}
    @keyframes p5{0%,76%{fill:#3A2148}78%,92%{fill:#B8862B}100%{fill:#3A2148}}
    .ok{opacity:0;animation:ok 8s infinite}
    @keyframes ok{0%,78%{opacity:0}82%,92%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.gaze,.p1,.p2,.p3,.p4,.p5,.ok{animation:none}.pt{fill:#B8862B}.ok{opacity:1}}
  </style>
  <defs>
    <radialGradient id="glow" cx="85%" cy="115%" r="85%">
      <stop offset="0" stop-color="#6A2C8C" stop-opacity=".95"/>
      <stop offset="1" stop-color="#24122F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#24122F"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <text class="name fade d1" x="70" y="145">Hagar Soliman</text>
  <text class="role fade d2" x="73" y="195">AI Engineer, computer vision, NLP and LLM apps</text>
  <text class="stat fade d3" x="73" y="248" xml:space="preserve">87% eye-tracking accuracy   |   92% bilingual NLP accuracy   |   Ranked 8th in class</text>

  <!-- calibration grid -->
  <rect x="905" y="70" width="210" height="180" rx="10" fill="none" stroke="#6A2C8C" stroke-opacity=".5" stroke-dasharray="4 6"/>
  <circle class="pt p1" cx="905" cy="70" r="7"/>
  <circle class="pt p2" cx="1115" cy="70" r="7"/>
  <circle class="pt p3" cx="1115" cy="250" r="7"/>
  <circle class="pt p4" cx="905" cy="250" r="7"/>
  <circle class="pt p5" cx="1010" cy="160" r="7"/>
  <!-- gaze reticle -->
  <g class="gaze" fill="none" stroke="#B8862B">
    <circle r="24" stroke-width="2" stroke-opacity=".55"/>
    <circle r="12" stroke-width="2.5"/>
    <path d="M0 -36v10M0 26v10M-36 0h10M26 0h10" stroke-width="2"/>
  </g>
  <text class="tiny ok" x="1010" y="292" text-anchor="middle">GAZE CALIBRATED</text>
</svg>
