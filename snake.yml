name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#B8862B&color_dots=#EDE4F2,#D9C8E4,#B48CCB,#8A4FAD,#6A2C8C
            dist/snake-dark.svg?palette=github-dark&color_snake=#E3B341&color_dots=#2A1A35,#4A2860,#6A2C8C,#8F55B5,#B48CCB

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
